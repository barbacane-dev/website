name: Cross-post blog articles

on:
  push:
    branches: [main]
    paths:
      - 'src/content/blog/**.md'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug to cross-post (e.g. what-is-an-mcp-gateway)'
        required: true
      dry_run:
        description: 'Dry run (print payload, do not post)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  cross-post:
    runs-on: ubuntu-latest
    # Its deployment rules decide which branches may use the credentials.
    environment: cross-post
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run unit tests
        run: npm test

      # Inputs reach the shell as environment variables, never as text in the
      # script, and the scripts refuse a slug that is not a post's.
      - name: Cross-post
        env:
          DEV_TO_API_KEY: ${{ secrets.DEV_TO_API_KEY }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          EVENT_NAME: ${{ github.event_name }}
          SLUG: ${{ github.event.inputs.slug }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            args=("--slug=$SLUG")
            if [ "$DRY_RUN" = "true" ]; then
              args+=(--dry-run)
            fi
            node scripts/cross-post.mjs "${args[@]}"
          else
            node scripts/cross-post.mjs
          fi
