name: Update cross-posts

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug to re-push (uses current source markdown)'
        required: true
      channels:
        description: 'Comma-separated channel filter (e.g. devto). Empty = all updatable channels.'
        required: false
      dry_run:
        description: 'Dry run (look up posts, do not update)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    # Its deployment rules decide which branches may use the credentials.
    environment: cross-post
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Inputs reach the shell as environment variables, never as text in the
      # script, and the scripts refuse a slug that is not a post's.
      - name: Update cross-posts
        env:
          DEV_TO_API_KEY: ${{ secrets.DEV_TO_API_KEY }}
          SLUG: ${{ github.event.inputs.slug }}
          CHANNELS: ${{ github.event.inputs.channels }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          args=("--slug=$SLUG")
          if [ -n "$CHANNELS" ]; then
            args+=("--channels=$CHANNELS")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          node scripts/update-cross-post.mjs "${args[@]}"
